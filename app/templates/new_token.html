{% extends "base.html" %}
{% block title %}Novo token · Email Tracker{% endblock %}
{% block content %}
    <p class="back-link"><a href="/">← todos os tokens</a></p>
    <h1>Novo token de rastreamento</h1>

    <form method="post" action="/ui/new" class="form">
        <label>
            Nome (identificação interna do email)
            <input type="text" name="name" required />
        </label>
        <label>
            Email do destinatário
            <input type="email" name="recipient_email" />
        </label>
        <label>
            Email para receber o alerta de confirmação (opcional, padrão: GMAIL_USER)
            <input type="email" name="alert_email" />
        </label>
        <button type="submit" class="btn btn-primary">Criar token</button>
    </form>
{% endblock %}
