<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Email Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">Email Tracker <span class="brand-sub">registro interno</span></a>
        {% if current_user %}<span>{{ current_user.username }} · {{ current_user.role }}</span><a class="new-token-btn" href="/ui/new">+ novo token</a>{% if current_user.role == 'admin' %}<a href="/ui/users">usuários</a>{% endif %}<form method="post" action="/logout" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token }}" /><button type="submit">Sair</button></form>{% endif %}
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
